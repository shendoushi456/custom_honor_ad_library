    api project(':modules:custom_honor_ad_library:aarlibrary:kssdk_ct_publishRelease_adapter')
    api project(':modules:custom_honor_ad_library:aarlibrary:open_ad_sdk')
    api project(':modules:custom_honor_ad_library:aarlibrary:appupdate')

    /////////////////taku_taku_taku_taku/////////////////////////////////////////////
    api project(':modules:custom_honor_ad_library:common_ad_taku:aarlibrary:anythink_core')
