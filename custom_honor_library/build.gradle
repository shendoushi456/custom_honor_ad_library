plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'com.ep.custom_honor_library'
    compileSdk 34
    defaultConfig {
        minSdk 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"


        buildConfigField "String","HOST","\"https://api.nunpingli.cn/\""
        buildConfigField "String","RELEASE_APPID",  "\"1111111\""
        buildConfigField "String","RELEASE_SSK",  "\"222222\""
        buildConfigField "String","APPID",  "\"3333\""
        buildConfigField "String","TAKU_APPID",  "\"a6af43b93c85cb\""
        buildConfigField "String","TAKU_APPKEY",  "\"a5fdb1fc70c498748541c52b04cb7b639\""
        buildConfigField "String","UM_ID",  "\"44444\""

    }


    viewBinding {
        enabled = true
    }

    buildFeatures {
        buildConfig = true
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }


    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += [
                "-Xjvm-default=all",
        ]
    }


    buildTypes {
        release {
            minifyEnabled false
            consumerProguardFiles 'proguard-rules.pro'//子模块要用这个命令混淆才能生效
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

dependencies {

    compileOnly(fileTree("${rootProject.projectDir}/app/libs") {
        include("*.jar", "*.aar")
    })

//    implementation project(':c_interface_library')

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'com.google.android.material:material:1.5.0'
    testImplementation("junit:junit:4.13.2")
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

    api 'com.google.code.gson:gson:2.9.0'
    api "com.squareup.retrofit2:converter-gson:2.3.0"
    api 'com.tencent:mmkv-static:1.2.10'

    api libs.com.blankj.utilcode

//    implementation 'com.blankj:utilcode:1.28.1'
    api 'com.github.Petterpx.walle:library:1.0.4'
    api  'com.bytedance.ads:AppConvert:2.0.1'
    implementation 'com.github.megatronking.stringfog:interface:5.0.0'
    implementation 'com.github.megatronking.stringfog:xor:5.0.0'


    // 友盟统计SDK
    api  'com.umeng.umsdk:common:9.6.5'// 必选
    api  'com.umeng.umsdk:asms:1.6.3'// 必选
    api 'com.umeng.umsdk:apm:1.8.0'//推荐，错误分析升级为U-APM产品，关注crash数据需集成
    api  'com.umeng.umsdk:share-core:7.1.7'//分享核心库，必选（为了获取umid）

    //获取OAID
    api('com.github.gzu-liyujiang:Android_CN_OAID:4.2.9'){
        runtimeOnly "com.huawei.hms:ads-identifier:3.4.62.300"
        runtimeOnly "com.hihonor.mcs:ads-identifier:1.0.2.301"
    }


    api 'com.squareup.okhttp3:okhttp:5.0.0-alpha.11'
    api 'com.squareup.okhttp3:okhttp:3.14.9'
    api 'com.google.code.gson:gson:2.9.0'


    api project(':modules:custom_honor_ad_library:aarlibrary:baidu_mobads_sdk_release')
